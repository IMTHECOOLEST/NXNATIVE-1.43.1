name: Controls check

# Compiles the iOS controller, touch and front-end sources against the iPhoneOS SDK and runs the
# controller unit tests. It needs no game files and no keys, so it is safe in a public repository
# and answers in a few minutes; a full IPA build is only worth spending after it is green.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (macos-26 = standard arm64 Mac with Xcode 26)"
        type: string
        default: macos-26
  push:
    paths:
      - "dm/ios/**"
      - "dm/host/**"
      - ".github/workflows/controls-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 headers (for the optional SDL3 backend check)
        continue-on-error: true
        run: |
          brew install sdl3
          echo "SDL3_INC=$(brew --prefix sdl3)/include" >> "$GITHUB_ENV"

      - name: Compile and test
        run: OUT="$RUNNER_TEMP/controls-check" bash dm/ios/tools/check_controls.sh

      - name: Summary
        if: always()
        run: |
          d="$RUNNER_TEMP/controls-check"
          [ -f "$d/summary.md" ] && cat "$d/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$d/errors.txt" ]; then { echo; echo '```'; head -n 80 "$d/errors.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controls-check
          path: ${{ runner.temp }}/controls-check
          retention-days: 7
